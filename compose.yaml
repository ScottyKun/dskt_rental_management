services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dskt_prod
      DB_USERNAME: andy
      DB_PASSWORD: famproject
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel.rule=Host(`famproject.cloud`)"
      - "traefik.http.routers.laravel.entrypoints=websecure"
      - "traefik.http.routers.laravel.tls.certresolver=leresolver"
      - "traefik.http.services.laravel.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"

  # Base de données
  postgres:
    image: postgres
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: andy
      POSTGRES_PASSWORD: famproject
      POSTGRES_DB: dskt_prod
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal

  # Cache Redis
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - internal

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dskt.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - internal
      - traefik-public
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pg.famproject.cloud`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=leresolver"
      - "traefik.docker.network=traefik-public"
    volumes:
      - pgadmin:/var/lib/pgadmin
  
volumes:
  pgdata:
  pgadmin:

networks:
  internal:
  traefik-public:
    external: true
