version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app-prod
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - mariadb
      - redis

  nginx:
    image: nginx:latest
    container_name: laravel-nginx-prod
    restart: unless-stopped
    ports:
      - "8080:80"        # en prod tu peux mettre derrière un reverse proxy
      - "443:443"      # SSL à ajouter plus tard
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mariadb:
    image: mariadb:11
    container_name: mariadb-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootProd123
      MYSQL_DATABASE: laravel_prod
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secretProd123
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    ports:
      - "3307:3306"    # accessible seulement local ou via VPN en prod

  redis:
    image: redis:7
    container_name: redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"    # sécuriser en prod, firewall + mot de passe si besoin

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-prod
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: rootProd123
    ports:
      - "8081:80"  # accessible depuis ton navigateur local
    depends_on:
      - mariadb


volumes:
  mariadb_prod_data:
